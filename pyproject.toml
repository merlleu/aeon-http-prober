[project]
name = "aeon-http-prober"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "mistralai-workflows",
    "httpx>=0.27",
]

[tool.uv]
index-strategy = "first-index"

[[tool.uv.index]]
name = "gemfury"
url = "https://pypi.fury.io/mistralai/"
default = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
